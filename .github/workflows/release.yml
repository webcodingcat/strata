# Release for a tag v<version> (= Version in style.css): builds the ZIP with
# the release workflow of wp-app-framework, tests it in a plain WordPress and
# attaches it to the GitHub release of the tag
# (https://webcodingcat.github.io/wp-app-framework/next/build-and-release/ci.html).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # Keep the ref at the framework version the lock file installs.
    uses: webcodingcat/wp-app-framework/.github/workflows/consumer-release.yml@v0.20.0
